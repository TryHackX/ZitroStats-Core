; ============================================================================
;  ZitroStats 5.5 settings
;
;  Lines starting with ; are comments. Switches accept 1/0, true/false, yes/no, on/off.
;  Paths are relative to the Soldat server folder; use / as the separator.
;  /zs_reload applies changes while the server runs. DataPath, SnapshotFile and JournalFile need a
;  restart, and so do the [MySQL] settings of Engine = mysql; the mirror starts again with changed ones.
;  Misspelt keys and invalid values are reported in the server console ("settings.ini: ...").
;  README.md explains every system.
; ============================================================================
; EXAMPLE: hold-the-flag.ini - Hold the Flag with respawns.
; EXAMPLE: The lines marked EXAMPLE say what was changed for this kind of server and why; the
; EXAMPLE: rest is settings.ini as it comes. Keep a copy of your settings.ini, copy this file over
; EXAMPLE: it (the name must stay settings.ini) and type /zs_reload.
; EXAMPLE: Example-configs/README.txt says what you still fill in.

[General]
; Statistics database: zitrostats.zsdb, its journal files and the lock file
DataPath = nickreg/
; balance.log, audit.log, suspicious.log, errors.log, teambalance.log, teambalance-history.log,
; integrity.log and crash.log
LogPath = logs/zitrostats/
; Code page of player names in e-mails, JSON exports, webhooks and MySQL:
; 1250 = Central European (Polish, Czech, ...), 1252 = Western European, 28591 = Latin-1, 65001 = UTF-8;
; any other number reads the names as Latin-1
SourceCodepage = 1250

[Database]
SnapshotFile = zitrostats.zsdb
JournalFile = zitrostats.journal
BackupPath = nickreg/backup/
; Player statistics are added to the journal this often (seconds), map and server totals once a minute.
; A crash loses at most that much. (1-60)
JournalFlushSeconds = 10
; The journal is folded into a new snapshot after this many minutes, if anything changed (10-10080),
; or when it reaches this many megabytes (1-1024)
CompactIntervalMinutes = 360
CompactJournalMB = 32
; Automatic backup every N days (0 = off, 0-365); the first one right after the first start. The newest
; BackupKeep (1-1000) automatic backups (*-auto.zsdb) are kept; backups made with /zs_backup or before
; admin operations are never deleted automatically.
AutoBackupDays = 14
BackupKeep = 12
; When the database cannot be read at startup: rename the damaged files to *.damaged-<date> and
; continue from the newest readable backup. With 0, or when no backup can be read, the server only
; reports it and saves nothing until an admin runs /zs_restore. A database written by a newer
; ZitroStats is never replaced: the statistics stay read-only until that release runs.
RestoreOnDamage = 1
; ZitroStats 4.x files. They are imported on the first start, when DataPath holds no zitrostats.zsdb,
; no zitrostats.zsdb.prev and no journal with changes, and they are only read. The .db files of the
; ScriptCore-only 4.x script are read only when the .bin file is missing.
LegacyAccountsBin = nickreg/accounts.bin
LegacyMapsBin = nickreg/maps.bin
LegacyAccountsDb = nickreg/accounts.db
LegacyMapsDb = nickreg/maps.db
LegacyServerRecords = nickreg/server_records.ini

[MySQL]
; MySQL or MariaDB. ZitroStats speaks the database protocol itself: no client library (libmysql) is needed,
; and the database may be 32- or 64-bit, on this machine or another one - MySQL 5.7, 8.x, 9.x and MariaDB
; 10.x, 11.x. The user's password may use mysql_native_password or caching_sha2_password (the MySQL 8
; default; sha256_password works too); a user or server that insists on an encrypted (TLS) connection
; refuses the login, and the console shows its answer (Access denied for a user made with REQUIRE SSL).
; Without TLS the statistics, the accounts and the login cross the network unencrypted: reach a database on
; another machine through a LAN, a VPN or an SSH tunnel. Connecting waits 5 s at most, every answer 30 s.
; The database itself must exist; the tables are made on the first run (the user needs the right to
; create and alter tables). Without a Host the statistics stay in the files (Engine = local).
; Which engine? For most servers the best choice is mysql (several servers sharing one live
; database) or local (a single server, files only). mirror is for a different job: a read-only
; copy of a server's statistics for a website, or adding up the statistics of separate servers
; that each keep their own accounts.
; Engine - where the statistics live:
;   local  - the files alone (default).
;   mirror - the files, and a copy in the tables zs_players, zs_maps and zs_server for websites. The Shared
;            switches below let several servers of the database add up what they know. With [Matrix]
;            Enabled = 1 the table zs_player_map_stats holds the main numbers of every account on every map.
;   mysql  - one database for every server: the accounts, maps, server record and seasons of all servers are
;            the same, and an account has the same number on each of them - a password set on one server
;            logs in on every server, a player without Steam is the account of their computer everywhere.
;            Every server keeps everything in memory and exchanges its changes every SyncSeconds; what
;            several servers count at the same time adds up, nothing is overwritten. The files stay a
;            cache: without the database a server works from them and sends what it collected once the
;            database answers - after a restart as well (a server whose first start with Engine = mysql
;            does not reach the database exchanges nothing until a start that does). Tables zs_db_accounts,
;            zs_db_maps, zs_db_server, zs_db_seasons, zs_db_meta, zs_db_jobs and zs_db_player_maps (the
;            [Matrix] records of every account on every map) (InnoDB). The daily balance and
;            the season change run on the first server that finds them due, with its own settings: keep
;            StartingPoints, [Inactivity] and [Seasons] the same on every server. The [MySQL] settings
;            are used from the next start of the server; the mirror takes them at /zs_reload.
; Every server of one database needs its own ServerID (1-65535).
Engine = local
Host = 127.0.0.1
Port = 3306
Database = soldat_stats
User = zitrostats
Password =
ServerID = 1
; Engine = mysql: seconds between two exchanges with the database (1-60). While the database does not
; answer, the pause doubles up to half a minute.
SyncSeconds = 3
; Engine = mirror: seconds between two runs (5-3600). Each run sends the players on the server, the accounts
; that played recently and all maps; every account is sent in each run until one succeeds, then once an
; hour. Such a full run also deletes the rows it did not write again, so accounts removed or merged here
; disappear from the copy as well. While the database cannot be reached, the pause between tries doubles up
; to 15 minutes.
MirrorIntervalSeconds = 60
; Also write the complete statistics of every account as JSON into the column zs_players.data.
; Handy for a website that wants every number, but every full run then sends a few MB per 1000 accounts.
FullJson = 0
; Engine = mirror: several servers on this database can add up their statistics. Every switch is off by
; default (each server shows only its own) and works between the servers that have it on. The numbers of the
; others are at most about two MirrorIntervalSeconds old, but an account's whole record goes out again only
; after it played or when its server starts again, so a change without a game (the daily balance, a reset)
; reaches the others later. The switches are read when the copy starts (also after /zs_reload). A Steam
; account is the same account on every server, an account without Steam the account of the same computer
; (HWID), as on one server. Use the same StartingPoints on every server.
; Passwords stay on each server. (Engine = mysql shares everything, the accounts and passwords too.)
; SharedProfiles - !stats, !otherstats, !allweapons, !allweaponsby, !wep, !spree, !rambo and !achievements
;                  add what the other servers hold for the same SteamID (or computer): 2 kills here and 2
;                  there show 4 on a third server. Points, ratings, seasons, badges, rivals and the
;                  per-map data of [Matrix] stay this server's. The older name SharedStats is read too.
; SharedRankings - !top, !topby, !topday/week/month, !topo and the positions of the "i" commands rank the
;                  players of every server by the points won on all of them (above the starting points);
;                  players known only to the others are listed too. !stats, !status, !rank, !session and
;                  !zs_search show that place and those points, and !statsi <n> the player at place n, also
;                  one never seen here. Tiers, !topskill, seasons and the HUD stay this server's, and
;                  !zs_search finds only this server's accounts.
; SharedMaps     - !topmaps, !topmapsby, !mapstats and !heatmap add the maps of the same name on the other
;                  servers, and so do the map's own counters in !mapmatchup, !mapweapstats and !mapwep; a
;                  map played only there is listed too.
; SharedWeapons  - !serverweapons, !serverweaponsby, !serverwep, !topweapons, !topweaponsby and !matchup
;                  add the weapons of the other servers.
; SharedServer   - !server and !activity add the activity, the online peak, the matches, the combat numbers
;                  and the weapons of the other servers; visitors and the hall of fame stay this server's.
SharedProfiles = 0
SharedRankings = 0
SharedMaps = 0
SharedWeapons = 0
SharedServer = 0

[Ranking]
; Points of a new account
StartingPoints = 1000
; Points for a kill = MaxPointGive / (MinimumPointDivider + Divider ^ ((killer points - victim points) / PowerDivider)),
; rounded and at least MinPointGive. The victim loses the same amount, but not below MinimumPoints.
MaxPointGive = 45
MinimumPointDivider = 1
Divider = 10
PowerDivider = 1000
MinPointGive = 1
; Floor for losses from kills, selfkills, teamkills and captures (the daily balance uses [Inactivity] BalanceFloorPoints)
MinimumPoints = 0
; Rows per page in the ranking lists (5-30)
TopDisplayLinesCount = 15
; Which rating !topskill, the skill metric of !topby, the skill value in !stats and the export use
; (the tiers follow TierBy below): elo (the classic points make the ranking; !topskill, the skill metric and the
; export then use the MMR), mmr (a match rating in the style of Heroes of the Storm that follows the strength of
; the whole team), glicko2 or openskill. Every method is always calculated, so switching later keeps its history
; and !otherstats shows all of them next to each other.
RankingSystem = elo
; Rating family of a game mode: auto (DM, PM, RM = ffa; CTF = ctf; TM, INF, HTF = team) or ffa / team / ctf for every mode
RankingFamily = auto
; Formula of the "Rating" index: skill (0..100, only how someone plays: accuracy, kill ratio,
; headshots, won matches and objective work, damped while an account has few kills and deaths), gamemode
; (the ZitroStats 4 formula, weights per mode, multiplied by the points) or unified (one formula
; for every mode, also multiplied by the points). The tiers follow TierBy below.
RatingMode = skill
; What decides the tier of [Ranks] (Bronze, Silver, ...):
;   points    = the points, like the ranking itself: a higher place in !top never has a lower tier
;   rating    = the "Rating" of the current game mode (RatingMode above), a badge of how somebody plays
;   mmr       = the MMR of the family of the current game mode (MinMMR in [Ranks])
;   glicko2   = the Glicko-2 value of that family (MinGlicko)
;   openskill = the OpenSkill value of that family (MinOpenSkill)
;   both      = points and rating
;   all       = every limit the tier line gives
TierBy = points
; Selfkill: always a selfkill, never a kill or a death.
;   penalty = the player loses SelfkillPenalty points (they leave the pool; Check Points pays the
;             missing sum back to active accounts every day).
;   zerosum = if a human enemy hit the player within [Mechanics] AssistSeconds, the player loses
;             SelfkillAssistShare % of the points a kill by that enemy would have paid (not below
;             MinimumPoints) and that enemy gets exactly what the player lost; without such a hit (or
;             when that enemy's account records no statistics) only SelfkillPenalty applies.
; Selfkills "under fire" are counted in both modes and shown to admins in /zs_status <p>, in orange when
; there are more than 2 of them and more than a tenth of the deaths.
SelfkillMode = zerosum
SelfkillPenalty = 2
SelfkillAssistShare = 50
; Teamkills never give points; TeamkillPenalty points are taken from the killer (0 = nothing)
TeamkillPenalty = 0
; Kills, points, damage, flags, play time, match results and ratings are recorded only while at least this many
; human players (not spectators) are in the game
MinHumansForStats = 2
; A switch to the spectators counts for the map statistics once per this many seconds, and every further switch
; pushes the window: going game - spec - game - spec in a loop counts once. 0 counts every switch.
; Moves made by the balance, /move, /swap or /mix never count.
TeamSwitchCountSeconds = 5
; What the selfkill percentage is a share of: all = every ended life (also teamkills and selfkills),
; enemy = only the deaths caused by opponents (a player who only ever selfkills then stays at 100%)
SelfkillPercentBase = all
; Time alive and the longest life count only while at least this many humans play
MinHumansForSurvival = 2
; Farming protection: a real line-up may also be required. MinTeamPerSide is how many human players
; the two strongest teams must each have in a team game, MinFFAHumans how many are needed in a
; free-for-all. 0 = off, so only MinHumansForStats counts.
MinTeamPerSide = 0
MinFFAHumans = 0

[Inactivity]
; An account is inactive when its player has not joined the server for InactivityDays.
; protection = players earn protection days by playing. Once a day at BalanceHour each inactive account uses a
;              protection day or pays points: ranking places 1-15 pay 220 down to 80, all others 35. An account
;              at or below BalanceFloorPoints pays nothing and keeps its protection days.
; decay      = once a day each inactive account loses 2% of its points above BalanceFloorPoints (at least 1).
;              In both modes the points go to active accounts below BalanceRecipientMaxPoints, at most
;              BalanceMaxPayout each, and the rest is removed. No account drops below BalanceFloorPoints.
; none       = no daily balance (check points below still runs when enabled)
Mode = protection
InactivityDays = 14
; Hour of the day (server time) of the daily balance
BalanceHour = 4
; The balance runs only with at least BalanceMinAccounts accounts and BalanceMinRecipients accounts that can receive
; points; protection days are used only on the days it runs. Check points does not need these minimums.
BalanceMinAccounts = 100
BalanceMinRecipients = 15
BalanceFloorPoints = 1000
BalanceRecipientMaxPoints = 2500
BalanceMaxPayout = 225
; Check points corrects slow inflation or deflation of the server's points once a day: missing points are paid to
; accounts active within CheckPointsActiveDays (at most 25 per account), surplus points are taken from inactive
; accounts (at most 50 per account). In protection mode an account with protection days is spared here too;
; when every inactive account has some, the surplus waits (balance.log says how much) until one runs out.
CheckPointsEnabled = 1
CheckPointsActiveDays = 90
; A surplus nobody may give (every inactive account has protection days) waits; after this many days it is
; taken anyway, a little every day, from the accounts that have not played for the longest time, protection
; or not. 0 = it waits for as long as it takes. (0-3650)
CheckPointsMaxWaitDays = 14
; protection mode: one protection day is earned per calendar day with ProtectSessionSeconds of play and
; ProtectEventsPerDay kills + deaths (bots do not count), up to ProtectMaxDays
ProtectSessionSeconds = 90
ProtectEventsPerDay = 10
ProtectMaxDays = 60
; decay mode: accounts whose player has not joined for this many days are hidden from the ranking until they play (0 = never)
DecayHideAfterDays = 60

[Glicko2]
; Always calculated; ranks players when RankingSystem = glicko2
; Tau: how quickly the volatility can change (0.2-1.2)
Tau = 0.5
InitialRating = 1500
InitialRD = 350
InitialVolatility = 0.06
; Ranking value = rating - ConservativeFactor x deviation. The deviation shrinks with every rated match and grows
; again for every day without one.
ConservativeFactor = 2

[OpenSkill]
; Always calculated; ranks players when RankingSystem = openskill (Plackett-Luce model). Ranking value = mu - 3 x sigma.
Mu = 25
Sigma = 8.333
Beta = 4.1667
Kappa = 0.0001

[AntiFarm]
; A victim that has not moved or fired for InactiveVictimSeconds is "inactive". Repeated kills of the same inactive
; victim by the same killer are worth these percentages of the normal points: first kill, second, third and so on;
; the last value applies to all further kills. The count starts again once the victim is active.
; InactiveVictimSeconds = 0 switches the rule off.
InactiveVictimSeconds = 20
InactiveVictimMultipliers = 100,50,25,0
; A killer is logged after killing the same victim SuspiciousKills times within SuspiciousWindowMinutes (counted from
; the first of these kills) while that victim has at most SuspiciousVictimMaxKills kills on the current map and at
; most SuspiciousMaxHumans human players are in the game. Each series is logged once.
SuspiciousEnabled = 1
SuspiciousMaxHumans = 4
SuspiciousKills = 10
SuspiciousWindowMinutes = 10
SuspiciousVictimMaxKills = 1
; Also show the line to online admins and in the server console (logs/zitrostats/suspicious.log is always written)
NotifyAdmins = 1
; Once a day, next to the daily balance: report accounts that last used the same computer or the same
; address (SharedDevices), and accounts whose headshot share or accuracy stands far above the server
; (Outliers, judged by the lower end of the confidence interval, so short lucky series are ignored).
; Both only write a line for the admin, they never change points.
SharedDevices = 1
Outliers = 1

[Matches]
; Count results of matches that end before the time or score limit (for example after a map vote)
CountAbortedMatches = 0
; A player gets a match result (win, loss, draw, rating) after playing at least MinParticipationSeconds and
; MinParticipationPercent of the match (on all teams together) and being connected when it ends.
; Matches shorter than MinParticipationSeconds give nobody a result.
MinParticipationPercent = 40
MinParticipationSeconds = 60
; Team modes: a player who left before the end gets a loss when the team did not win or draw and the player's
; time on the team was at least LeaverMinProgressPercent of the match
LeaverCountsAsLoss = 1
LeaverMinProgressPercent = 50

[CaptureTheFlag]
; CTF: every human enemy with statistics pays CapPoolPoints into the capture pool (not below MinimumPoints).
; The capper gets CapWinnerSharePercent of the pool and the human teammates share the rest; without teammates
; the capper gets all of it.
CapPoolPoints = 13
CapWinnerSharePercent = 60
; Points for a capture when nobody paid into the pool (CapPoolPoints = 0, no human enemies or all of them at
; MinimumPoints) and for a capture in Infiltration
FlagScoreFallbackPoints = 25
; CTF and Infiltration: a kill counts as base defense (the victim was this close to your flag base) or base
; attack (you were this close to the enemy flag base); meters
BaseRadius = 30

[Mechanics]
; A new visit (session) is counted when the previous one ended at least this many minutes ago (0-1440;
; 0 counts as 1)
VisitCooldownMinutes = 15
; Savior: killing the attacker of a teammate within SaviorSeconds; Avenger: killing the killer of a teammate within AvengerSeconds
SaviorSeconds = 3
AvengerSeconds = 2
; Assist: at least AssistMinDamagePercent % of the full health (MaxHealth, or MaxHealthRealistic in realistic
; mode) as damage to the victim during its current life, with the last hit within AssistSeconds before another
; player kills it
AssistSeconds = 7
AssistMinDamagePercent = 65
; Full health: a hit counts at most this much damage (and at most what the victim had left); damage shown as
; kills or deaths (~kills, ~deaths) is damage / this value
MaxHealth = 150
; Health in realistic mode (0 = use MaxHealth there as well)
MaxHealthRealistic = 65
; Multi-kill: a kill within this time after the previous one continues the chain (double, triple, ...)
MultiKillWindowSeconds = 3.5
; Spawn kill: victim killed within SpawnKillSeconds after spawning (never in Survival)
SpawnKillSeconds = 3
; Camp kill: the killer stayed within CampRadius pixels for CampSeconds
CampSeconds = 12
CampRadius = 80
; Bink recovery: killing a player who did at least BinkDamage damage to you during your life, with the last hit
; within BinkSeconds
BinkDamage = 35
BinkSeconds = 1.0
; Finisher: a kill with USSOCOM, Desert Eagles, knife (also thrown), chainsaw, LAW, flamer or fists within
; FinisherSeconds after your last hit on that victim with MP5, AK-74, AUG, Spas-12, Ruger, M79, Barrett, Minimi
; or Minigun
FinisherSeconds = 3
; Escort kill (team modes): the killer or the victim is within EscortRadius pixels of a teammate carrying a flag
EscortRadius = 350
; Juggle: grabbing a flag again within JuggleSeconds after dropping or throwing it
JuggleSeconds = 1.5
; Contested hold (Hold the Flag): keeping the flag ContestedHoldSeconds after an enemy first hit you while carrying it
ContestedHoldSeconds = 5
; Height kill: the killer stood more than this many pixels above the victim
HeightAdvantagePixels = 60
; Last stand (Survival): only with at least this many human players in the round (2-32), so one
; against one is none. In team modes the last living player of a team left against two enemies or
; more, in DM/PM/RM the last one standing, who also wins the round.
LastStandMinPlayers = 3

[Sprees]
; Kill streak levels: a chat line and/or a big text on screen when a player's streak reaches a level,
; and when an enemy ends it (README, "Kill streaks"). The streaks themselves - !spree, the
; achievements and the Shut Downs counter - are always counted, whatever Enabled and the levels below say.
Enabled = 1
; LevelN = <kills>, <name>, <style>, <message>: up to 12 levels (Level1-Level12). kills is 1-50; name
; up to 20 characters; style is off, chat, bigtext or both (both if left out or not one of these);
; message is the rest of the line, up to 100 characters (%s = the player, %d = the kills, %% = a %).
; The first Level line found replaces every level below it; levels are sorted by their kills, and a
; kills number repeated in a later line is ignored. The achievements Rampage and Godlike are the levels
; of those names: a player earns them at those levels' kills (10 and 25 when no level has the name).
; Without one valid Level line these are used:
; EXAMPLE: the built-in levels are kept: they start at 3 kills, as a life in an objective
; EXAMPLE: mode holds fewer kills than one in deathmatch
Level1 = 3, Killing Spree, chat, %s is on a KILLING SPREE!
Level2 = 5, Rampage, both, %s is on a RAMPAGE!
Level3 = 7, Dominating, both, %s is DOMINATING!
Level4 = 10, Unstoppable, both, %s is UNSTOPPABLE!
Level5 = 12, Mega Kill, both, %s: MEGA KILL!
Level6 = 15, Ultra Kill, both, %s: ULTRA KILL!
Level7 = 17, Wicked Sick, both, %s is WICKED SICK!
Level8 = 20, Monster Kill, both, %s: MONSTER KILL!
Level9 = 25, Godlike, both, %s is GODLIKE!
Level10 = 30, Holy Shit, both, %s: HOLY SHIT! %d kills in a row!
; shown when an enemy kills a player whose streak had reached the lowest level above (style as
; above, default chat); %s = the killer, then the victim, %d = the victim's streak
ShutDown = chat, %s ended the killing spree of %s (%d kills)
; colour of every spree message, chat and big text (RRGGBB)
Color = FF4500
; seconds a big text stays on screen (1-30) and its size (0.02-1)
BigTextSeconds = 3
BigTextScale = 0.1
; vertical position of a big text, in the 640x480 space of the game (0-480); the end-of-streak text
; shows one line below it
BigTextY = 130

[Identity]
; Every account follows one key. A Steam player gets the account of the SteamID; a player without Steam gets the
; account of the computer (HWID), which the player can protect with a password (see [Accounts]). Names are free:
; an account remembers the names used. Steam and computer accounts are never merged automatically (/zs_merge does).
; Seconds to wait for Steam to confirm a joining player. Until then the player records no statistics; without the
; confirmation the account of the computer is used, and a later confirmation still moves the player to Steam.
; 0-60, 0 = no wait.
SteamAuthWaitSeconds = 8
; Names remembered per account (1-1000); the one used least recently is forgotten first
NameHistoryLimit = 30
; A second player on the same computer (HWID), with the same IP address or on the same Steam account:
; allow = nothing happens, warn = online admins get a note, kick = the player who joined later is kicked.
; The IP check also hits players who share one router. Bots are never checked. An account is played by one
; player at a time: with allow or warn, the later player on the same computer or Steam account records no
; statistics.
DuplicateHWID = allow
DuplicateIP = allow
DuplicateSteam = allow

[Accounts]
; Players without Steam can protect the account of their computer with a password (/register). A registered
; account records statistics only after /login, or on a computer trusted after a login. Steam players need no
; password: Steam proves who they are. Both lengths are 4-20 characters. A password may not contain spaces or
; accented letters, and cannot be the account's name, one repeated character or a well-known password.
MinPasswordLength = 6
MaxPasswordLength = 20
; PBKDF2-SHA256 rounds for new passwords (/register, /resetpass, /zs_setpass), hashed on a background thread.
; 10000-2000000.
PasswordIterations = 100000
; A computer used for /register or /login stays trusted for TrustedDeviceDays; TrustDeviceSameIP also requires the
; same network (first three IP octets). /account untrust and /zs_setpass remove all trusted computers,
; /changepass and /resetpass all except the current one. An account keeps at most 8; a new one replaces the oldest.
; TrustedDeviceDays: 0-3650, 0 = no computer is trusted.
; TrustedDevices = 0 turns the whole mechanism off: the password is then needed on every computer, every time.
; AllowTrustChoice lets a player decide for their own account with /account trust on|off (the hint is only shown
; when it is allowed). A player with a fixed IP who is worried about a copied HWID can simply turn it off.
TrustedDevices = 1
AllowTrustChoice = 1
TrustedDeviceDays = 30
TrustDeviceSameIP = 1
; Wrong passwords before the account is locked (1-100), and the lock time in minutes (1-10080). Only wrong
; passwords within LoginLockMinutes of the first one count; /changepass and /removemypass count too.
; /forgotpass and /resetpass still work during the lock.
LoginMaxAttempts = 5
LoginLockMinutes = 15
; A player on a registered account who is not logged in (another network, or a copied HWID) records no statistics,
; is reminded every LoginReminderSeconds and after LoginGraceSeconds: none = keeps playing, spectator = moved to
; spectators, kick = kicked. With spectator the player stays a spectator until the password is right.
; LoginGraceSeconds = 0 moves them the moment the account is known, without a countdown (0-3600).
; LoginReminderSeconds: 5-3600.
UnauthenticatedAction = none
LoginGraceSeconds = 60
LoginReminderSeconds = 30
; After a successful login put a player we moved to the spectators back into the game. The team is the one the
; balance wants; with the balance off it is the smaller team.
LoginReturnToGame = 1
; Let players take the password off their own account with /removemypass <password>. They then play without
; logging in, and anybody on their computer plays on their account.
AllowPasswordRemoval = 0

[Mail]
; E-mail codes for /setemail and /forgotpass. Nothing is sent while Enabled = 0.
Enabled = 0
; curl (SMTP with curl), sendmail, or command (your own program, see CommandTemplate)
Method = curl
; curl is also used for webhooks
CurlPath = curl
; smtps://host:465 or smtp://host:587 (STARTTLS is required). SmtpUser and SmtpPassword go to curl in a temporary
; file only the server's user can read, never on the command line; leave SmtpUser empty for no login.
; FromAddress must be a valid address, otherwise e-mail stays off (the console warns).
SmtpUrl = smtps://smtp.example.com:465
SmtpUser =
SmtpPassword =
FromAddress =
FromName = ZitroStats
SendmailPath = /usr/sbin/sendmail
; Method = sendmail runs SendmailPath -t -i with the message on its input.
; Method = command: program and arguments; placeholders {to} {from} {subject} {file} ({file} = complete message).
; The template is split into words before the placeholders are filled, and runs without a shell.
; A mail counts as delivered when the program ends with exit code 0.
CommandTemplate =
; Codes expire after CodeLifetimeMinutes (1-1440); an account gets at most one e-mail per MinIntervalMinutes
; (0-1440, 0 = no wait) and MaxPerDay a day (1-100). A mail the server was too busy to take does not count.
; Five wrong codes make a code invalid.
CodeLifetimeMinutes = 15
MinIntervalMinutes = 10
MaxPerDay = 3
; Seconds curl may take for one mail (5-300); a mail program still running 5 seconds later is stopped
TimeoutSeconds = 30
; Server name used in the e-mails. Delivery errors are written to audit.log.
ServerName = Soldat server

[Admin]
; Password for /yes, which confirms resets, restores, merges, /zs_unregister, /zs_setpass and /removeolderthan:
; /yes <password>
; While it is empty these operations are refused. Use a password different from the server admin password.
; EXAMPLE: fill in: a password only the admins know (Example-configs/README.txt)
ConfirmPassword =
; Seconds to confirm (5-600); only the admin who started the operation can confirm it
ConfirmSeconds = 30
; A wrong password, or !yes with any text typed in public chat, locks /yes for this many minutes (1-10080)
; and cancels the operation that waits
ConfirmLockMinutes = 30
; Write to logs/zitrostats/audit.log: every admin command with the admin's name, IP and account
; (passwords are replaced by ***), confirmed admin operations, account events and e-mail errors
AuditLog = 1

[Messages]
; A welcome line with the rank and the points once the account of a joining player is known (not for
; spectators or players who are not logged in)
WelcomeEnabled = 1
; 1 = welcome message for everybody, 0 = only for the joining player
WelcomeBroadcast = 0
; Repeated information message (minutes, 0 = off) and its text (at most 120 characters); ContactText is
; the answer of !contact (at most 200 characters)
InfoBroadcastMinutes = 7.5
InfoBroadcastText = Enter !zitro to see statistics commands. Information: !contact
ContactText = Contact the server administrator on the community forum.
; 1 = announce unlocked achievements to everybody, 0 = only to the player
AchievementBroadcast = 1
; Announce the winner of every survival round and of the match
RoundWinBroadcast = 1
; Announce the end and the start of seasons
SeasonBroadcast = 1

[HUD]
; On-screen line with rank and points; players switch it with !hud.
; Enabled = 0 turns it off on the server; DefaultOn = 1 shows it to new accounts from their first join.
; X and Y are the position (from the top left, in the 640x480 space of the game), Scale the size of the
; letters, Color the colour as $RRGGBB, Layer the text layer (change it when another script uses 12).
; RefreshSeconds: how often the line is drawn again; EventSeconds: how long each note after the points
; stays on the line (points won or lost, FIRST BLOOD!, a multi-kill, an assist ...). Bounds: Layer 0-255,
; X and Y 0-4000, Scale 0.001-1, RefreshSeconds 1-60, EventSeconds 1-10; a value outside is set to the
; nearest bound.
Enabled = 1
DefaultOn = 0
Layer = 12
X = 20
Y = 436
Scale = 0.02
Color = $F15D70
RefreshSeconds = 3
EventSeconds = 2

[Commands]
; Lists that sort every account (!topby, !top <metrics>, !topday/week/month, !zs_search, !server, !serverweapons,
; !serverweaponsby, !serverwep, !topweapons, !topweaponsby, !topmapsby, and !topskill with RankingSystem = elo)
; and the lists that go through every record of a map (!maprivals, !mapweapstats, !mapwep) once per this many
; seconds per player (0 = no wait); admins are exempt. Page commands (/zs_next, /zs_prev, ...) do not wait. The
; whole server also runs at most 3 such lists a second (pages and name searches of every account included; only
; the server console is exempt): a list over that is refused with "The server is busy".
HeavyCooldownSeconds = 5
; Commands a player (admins too) may send per second; the ones over it are ignored, with one "Too many
; commands" note
CommandsPerSecond = 2

[LastFight]
; !lastfight [1-3] shows a player his last 3 deaths since he joined: who killed him with what, every hit
; he took and dealt - the zone, the distance from where the shot was fired, the flight time of the
; bullet, the speed of the one who was hit and an estimate whether he could have dodged it; a shot nobody
; saw (a bot's) is worked out from the bullet at the hit -, who else hurt him, what he dealt to whom and
; whether it killed - also after his death, by a bullet still flying -, the points and assists. Only
; humans keep records; nothing of it is saved. Enabled = 0: nothing is recorded and !lastfight says it
; is off.
Enabled = 1
; A moment after each death (when AfterSeconds are over, or at the respawn) one or two console lines to
; the player who died: the killer, the weapon, the distance and zone of the hit that killed, his hits and
; damage by zone, who else hurt him, the points lost, and what the player dealt. Nothing for a player who
; went to the spectators.
DeathSummary = 1
; The seconds before a death and after it that its record holds (after it: bullets still flying, the
; points of the death). Bounds: BeforeSeconds 3-20, AfterSeconds 1-8.
BeforeSeconds = 10
AfterSeconds = 4

[Seasons]
Enabled = 1
; monthly (calendar months) or days (every Days days)
Length = monthly
Days = 30
; Players stored in the season archive (!topseason <id>), ordered by the points won in the season, then
; kills (3-500); the best three receive a badge
ArchiveTop = 50
; Minimum play time in a season to be archived
MinSeasonMinutes = 30
; Points when a new season starts: none, hard (everybody back to StartingPoints) or soft
; (StartingPoints + (points - StartingPoints) x SoftResetFactor). The first season never changes points.
PointsReset = none
SoftResetFactor = 0.5

[Achievements]
Enabled = 1

[Export]
; nickreg/stats.json for websites: the best JSONExportTopCount players, maps, weapons, the last three seasons and
; server totals. Nothing is exported while the database is read-only.
JSONExportEnabled = 1
JSONExportPath = nickreg/stats.json
JSONExportTopCount = 50
; nickreg/players.json with every account and its detailed statistics
; Both files are written every ExportIntervalMinutes (1-1440, the first time one interval after the start)
; and on /zs_export. Neither contains IP addresses, hardware IDs, SteamIDs or e-mail addresses.
FullExportEnabled = 0
FullExportPath = nickreg/players.json
ExportIntervalMinutes = 5

[Webhook]
; HTTP POST with JSON to Url (http:// or https://), sent with curl ([Mail] CurlPath). A post fails on an HTTP
; error or after 15 seconds; failed posts are not repeated and not logged.
; Events, separated by commas: export (every export run), match (counted matches), season (archived season),
; record (new online peak, sent once it has held for 5 minutes)
; Format: json    = the event as JSON, for your own website or bot
;         discord = a readable message for a Discord webhook URL (player names never ping anyone)
Enabled = 0
Url =
Events = season,record
Format = json

[MMR]
; Match rating in the style of Heroes of the Storm, kept per mode family (FFA, Team, CTF). A result moves the
; rating by Step x (result - expected result), the expected result coming from the average rating of your side
; against the average of the other side(s); in FFA every player is measured against the average of all others.
; So beating a strong line-up is worth more than beating a weak one and a weak player on a strong team gains less.
; The first PlacementMatches games move 2.5 times faster. The rating never drops below 100.
; Start 100-10000, Step 1-200, PlacementMatches 0-100.
Start = 1500
Step = 24
PlacementMatches = 10

[Leagues]
; Leagues in the style of Heroes of the Storm. At start and once a day every account with at least
; PlacementMatches matches is ordered by Source (mmr = its MMR in the mode family it plays most,
; rating = the Rating index for the mode of that family) and cut into the leagues of [Ranks], each
; split into Divisions steps (1 = best). !otherstats always shows the league; Enabled = 1 also shows
; it in !stats and !rank in place of the plain tier.
Enabled = 0
Source = mmr
Divisions = 5
PlacementMatches = 10
; Percentages counted from the top, one number less than there are tiers: 2,8,20 = the best 2 % in the
; first league, the rest up to 8 % in the second, up to 20 % in the third; the last league takes everyone
; who is left. PlacementMatches counts the MMR matches of that mode family (Source = mmr) or all won and
; lost matches (Source = rating). The leagues are calculated even while Enabled = 0.
Percents = 2,8,20,40,65,85

[MapVote]
; The library's own map vote for !v, !nextmap, !lastmap, !randommap, !map, !votemap, /votemap, !maps,
; !allmaps and !searchmap (README, "Map vote"). While it runs the clients see it as Soldat's own vote (F12
; works); Soldat's own vote dialog always shows 20 seconds, whatever VoteSeconds says. 0 leaves the
; commands to other scripts and Soldat's own map vote works as usual; /map and /nextmap always stay
; the server's own admin commands.
Enabled = 1
; percent of the players who may vote - the teams and the spectators, see CountSpectators - needed
; for a vote to pass (1-100)
VotePercent = 60
; how long a vote runs before it fails (5-120)
VoteSeconds = 20
; seconds before the player who started a vote may start another (0-3600)
StarterCooldownSeconds = 45
; a new vote needs at least this many seconds left on the map, with a time limit only (0-3600)
MinTimeLeftSeconds = 26
; no new vote in the first seconds of a map (0-600)
BlockAfterChangeSeconds = 20
; players needed to start a vote, counted as for VotePercent (1-32)
MinPlayers = 1
; 1 = every spectator counts for VotePercent and MinPlayers; 0 = only the spectators who start a vote
; or vote for it count, for that vote
CountSpectators = 1
; a map of the maps folder that is not in the maps list may be voted too (the search looks at the
; maps list first, then the maps folder)
AllowAnyMap = 1
; ctf_/inf_/htf_ maps restrict !randommap and !allmaps to the style being played
; EXAMPLE: 1 - !randommap and !allmaps keep to the htf_ maps of the maps folder
; EXAMPLE: (a map named in a vote still works)
FilterByGameStyle = 1
; the folder read for !allmaps and for votes of maps outside the maps list; empty = the server's own
; maps folder (two levels above this script's folder)
MapsFolder =
; how often the maps folder is read again (0-1440 minutes; 0 = only at the start and on /zs_maps rescan)
RescanMinutes = 5
; the vote percent put back once the library's own vote dialog is gone, when the percent from before
; the vote is not known (0-100; 0 = leave it as it is)
RestoreVotePercent = 60
; switch a single command off (another script may then answer it instead)
VoteCommand = 1
NextMapCommand = 1
LastMapCommand = 1
RandomMapCommand = 1
MapCommand = 1
VoteMapCommand = 1
SlashVoteMap = 1
MapsCommand = 1
AllMapsCommand = 1
; !searchmap <part> [page]: the maps of the list and of the folder whose name holds the text
SearchMapCommand = 1

[Balance]
; Team balance for Teammatch, CTF, Infiltration and Hold the Flag. Players are judged by their rating
; and by how they do on the current map, and the balance works in three ways:
; - a player who joins, or changes the team in the menu, is placed in the team that needs a player;
; - when one team stays too strong, one player (or a pair) changes team at their next death;
; - a new map can start with even teams.
; The server's own Balance_Teams may stay on. Turn off other balancing scripts such as cube.
; The code's own default is Enabled = 0; this shipped file turns the team balance on.
Enabled = 1
; blend = the rating plus the form on this map (the form counts more with every minute played),
; global = the rating only, map = the form on this map only (everybody starts even)
Method = blend
; the rating of the players: mmr, glicko2, openskill or points
Skill = mmr
; humans in the teams needed before the balance moves players who play (corrections, start of a map);
; joins are placed with fewer players as well
MinPlayers = 4
; place joining players and team changes from the menu in the team that needs a player; a joining
; player placed in another team is moved to a spawn point of that team at once (Soldat puts them at
; the base of the team they clicked)
AssignJoins = 1
; a player keeps the chosen team when it is at most this many percent points worse than the best one
JoinTolerance = 3
; a join is looked at again once the player's account is known, when that is within this many seconds
; of the join and the player has no kill, death or capture yet; joins are looked at one at a time.
; A player back within RejoinMemoryMinutes gets the lock and the team back as soon as the account is known.
JoinReviewSeconds = 15
; act when a team's chance to win stays above Threshold percent for SustainSeconds; a change has to
; bring the chances below Target or improve them by MinGain percent points
Threshold = 60
Target = 55
MinGain = 4
SustainSeconds = 45
CheckSeconds = 5
; at least this long between two changes (10 seconds when the numbers are uneven), and at most this
; many changes on one map; moves made by admins do not count here
CooldownSeconds = 90
MaxMovesPerMap = 6
; the teams may differ by this many players; a bigger difference is fixed after LeaveGraceSeconds
; (often a new player fills the gap first); such a fix only has to bring the numbers closer
MaxCountDiff = 1
LeaveGraceSeconds = 20
; no changes in the last seconds of a map or when the score is decided
MinTimeLeftSeconds = 90
; the chosen player changes team at the next death, at the latest after PendingMaxSeconds;
; in survival only while dead, a living player is never moved
MoveOnDeath = 1
PendingMaxSeconds = 20
; the player with the best form of the team on this map is not moved for the chances (uneven numbers
; move them only when nobody else can go)
ProtectTop = 1
; a moved player may not go back for LockMinutes and is not chosen again for ImmunityMinutes (uneven
; numbers move them only when nobody else can go);
; leaving the server and coming back within RejoinMemoryMinutes changes nothing
LockMinutes = 3
ImmunityMinutes = 15
RejoinMemoryMinutes = 10
; how a team's chance follows from its players: every SkillPerDouble rating points double a player's
; weight, and SizeImpact decides how much a player more counts (1.5: five against four = 58%)
SizeImpact = 1.5
SkillPerDouble = 400
; a rating from few matches counts less: games / (games + UncertaintyGames)
UncertaintyGames = 5
; the form on the map: FormStep rating points per duel, full weight after FormFullMinutes
FormWeight = 1
FormFullMinutes = 10
FormStep = 24
; Method = map: the chances are not acted on in the first minutes of a map
MapWarmupMinutes = 3
; take the Alpha/Bravo record of the map into account (a map may favour one side), once the map has
; 10 decided matches
UseMapBias = 1
; start of a map: keep, fix (the fewest changes that even the teams, only when they are uneven),
; shuffle (a new split, only when they are uneven) or mix (new teams on every map: a random line-up,
; evened out the way /mix does it, never less fair than Target - see README, "Mixing the teams");
; in survival the start is always left alone
MapStart = fix
; how long after the map change the start is looked at (1-60 seconds; 0 counts as 1): players whose
; game lacks the map drop out to download it and join again later, placed like new players; players
; still loading keep their team and can be moved. 1-2 seconds moves them while they pick their weapons.
MapStartSeconds = 2
; ask the stronger team for a volunteer (!switch) before somebody is chosen
Volunteers = 1
VolunteerSeconds = 15
; a player who does not move for AfkSeconds counts with AfkFactor of their weight
AfkSeconds = 60
AfkFactor = 0.3
; bots count with the rating of this percentile of the server's players and are never moved;
; CountBots = 0 leaves bots out of the teams' strength and numbers
BotSkill = 30
CountBots = 1
; teams in Teammatch: auto (the teams in use), 2, 3 or 4
TeammatchTeams = auto
; accounts the balance never moves, e.g. #12, #44 (admins can also use /balexclude)
Exclude =
; 1 = use the SizeImpact and SkillPerDouble that predicted this server's matches best, once 50
; matches are recorded (/balinfo shows them)
AutoTune = 0
; tell everybody when a player changes team
Announce = 1

[Integrity]
; The score guard. Soldat gives team points for things that are no play, and main.pas takes them
; back before anybody counts them:
; - survival kills a player who joins a team or changes it, and the server reads that death like
;   any other: the team that still has somebody alive is given the round;
; - a flag carrier still scores after the round or the match is over (the double capture);
; - points can be farmed with nobody to play against;
; - after a map change survival leaves players who were dead lying dead on the new map;
; - /pause while the map is changing throws the map change away, and the server keeps the map with
;   the full time again.
; Statistics never count what was taken back. The decisions are in logs/zitrostats/integrity.log.
Enabled = 1
; take back the round point a join or a team change caused (only with survival on, in every team mode)
FixJoinScore = 1
; a capture after the round or the match is decided counts for nobody
VoidDoubleCaptures = 1
; players the other teams together need for a point to count (0-16, dead players count, spectators
; do not); 0 turns this off
MinOpponents = 1
; put players the map change left dead back on their feet (the server prints "has joined" for them)
RespawnAfterMapChange = 1
; refuse /pause while the map is changing, and repeat a map change that was thrown away
ProtectMapChange = 1
; tell everybody when a point or a capture was taken back (at most 2 lines per tick)
Announce = 1

[Matrix]
; What every player did on every map: one record per account and map that counts there what the
; account's own statistics count, as far as it can belong to one map - the time played, matches, rounds,
; kills, deaths, points, flags, shots, hits, damage, healing and kits, times to kill, movement, feats,
; multi-kills, melee and explosives, teamkills -, the weapons used on the map, the rivals (who killed
; whom, the points won from and lost to each other, the damage both ways, the last fight), the weapon
; matchups (a weapon against the weapon the other one held) and where the kills and deaths were (the
; cells of !heatmap). A record exists only once something was counted, a rival only once the two
; fought. The maps keep their weapon matchups as well. Counted for humans while the statistics count,
; as everything else. 0 = none of it is recorded, and the commands that show it say so.
Enabled = 1
; Old per-map data: the daily maintenance deletes the records of an account that has not been on the
; server for this many days (0 = never, 0-3650), with everything they hold - its counters on every map,
; its weapons there, its rivals (player against player, with the points and the damage), its weapon
; matchups and its heat cells. What stays: the account's own statistics (!stats, !otherstats,
; !allweapons ...), the maps' own data (!mapstats, !heatmap, the weapon matchups of the maps) and the
; rival entries the other players keep about it, which go on showing its name (an account deleted
; altogether, by /removeolderthan, takes those entries along).
MatrixPruneDays = 90
; 1 = every record also keeps where the player killed and died on the map (the heat cells).
PlayerHeatmap = 1
; Rivals one record keeps at most (1-10000). A full list makes room for a new rival by dropping the
; one with the fewest kills and deaths between the two, of those the one fought longest ago.
MaxRivals = 200

[Debug]
; 1 = after every kill tell the online admins and the console what Map.RayCast answered: whether the
; killer still saw the victim (Cover (live)) and whether the line from where the lethal shot was fired
; to where it hit was clear (Cover (shot)). Works with bots; meant for testing only.
RayCastLog = 0

[Colors]
; The colour of everything ZitroStats writes in the game, as RRGGBB (a #, a $ or a 0x in
; front is allowed). Leave a line out and the built-in colour is used.
; The title line of a table
ColorHeader = FFD700
; The section lines inside a table
ColorSubHeader = 00E5FF
; Kills, deaths, streaks
ColorCombat = 55FF55
; Shots, hits, accuracy
ColorShooting = FFFFFF
; Sprees, achievements, records
ColorFeats = FFB703
; Flags, points, admin commands
ColorObjective = FFA500
; Assists, team damage, balance
ColorTeamplay = FF6B6B
; Matches, rounds, wins
ColorMatches = A8E6CF
; Time played, visits, rules
ColorActivity = B0C4DE
; The legends under a table
ColorHint = 80D0FF
; First, second and third place of a ranking
ColorTop1 = FFD700
ColorTop2 = E0E0E0
ColorTop3 = CD7F32
; The row that is you, and the other rows
ColorYou = 00FF66
ColorOtherRow = 9BD0E8
; Something went wrong, something worked, something to notice
ColorBad = CC3300
ColorGood = 66CC66
ColorWarn = FF8C00
; The rank line of a profile
ColorRankLine = 00E5FF


[Ranks]
; TierN = Name, MinPoints, MinRating, Color, MinGlicko, MinOpenSkill, MinMMR
; Tiers are checked in the order of the lines; a player gets the first tier the account reaches, otherwise the
; last one. [Ranking] TierBy says which limit counts: MinPoints (points, the default), MinRating (rating: the
; "Rating" of the current game mode), MinMMR, MinGlicko or MinOpenSkill (mmr, glicko2, openskill: that rating
; of the family of the game mode), both (points and rating) or all (every limit the line gives). A line without
; the limit the chosen measure needs is skipped. At most 16 tiers; Color needs a $, # or 0x in front.
Tier1 = Grand Master, 2200, 75.0, $FFD700, 2100, 35, 2100
Tier2 = Master, 1800, 60.0, $E040FB, 1900, 30, 1900
Tier3 = Diamond, 1500, 48.0, $00E5FF, 1750, 25, 1750
Tier4 = Platinum, 1300, 38.0, $00E676, 1600, 20, 1600
Tier5 = Gold, 1150, 28.0, $FFEA00, 1500, 15, 1500
Tier6 = Silver, 1000, 18.0, $CFD8DC, 1350, 8, 1350
Tier7 = Bronze, 0, 0.0, $CD7F32
